# Render Blueprint for the API (free plan). See docs/deploy.md for the full setup:
# Neon (Postgres) + Render (this API and the Telegram bot) + Vercel (web).
services:
  - type: web
    name: counterpoint-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    # pnpm comes from the root packageManager field via Corepack (bundled with Node 22).
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:packages && pnpm --filter @counterpoint/api build
    # Runs from the built files, so the start does not depend on pnpm being on the PATH.
    startCommand: cd apps/api && node_modules/.bin/prisma db push --skip-generate && node dist/main.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Not NODE_ENV=production: Render applies it to the build, and pnpm would skip the dev
      # dependencies the build needs (Nest CLI, Prisma CLI, TypeScript).
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: SECTORS_BASE_URL
        value: https://api.sectors.app/v2
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: RATE_LIMIT_PER_HOUR
        value: "10"
      - key: DAILY_THESIS_CAP
        value: "200"
      # Asked for when the Blueprint is created (sync: false keeps them out of the repo).
      - key: DATABASE_URL
        sync: false
      - key: SECTORS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
